# Dedicated subdomain deploy — cdn.ucc.edu.gh is this app's own domain now
# (previously nested as /sgs, /sgs-admin, /sgs-api under the shared
# ehub.ucc.edu.gh server block; that path-prefix scheme is retired along
# with this switch — the merged app now serves everything at root paths:
# customer at /, admin at /admin, the folded-in API at /api).
#
# Install: copy to /etc/nginx/sites-available/cdn.ucc.edu.gh, symlink into
# sites-enabled, then:
#   sudo certbot --nginx -d cdn.ucc.edu.gh
# which issues the cert and rewrites this file in place with the SSL
# directives + HTTP->HTTPS redirect — don't hand-write ssl_certificate
# paths here.

server {
	listen 80;
	server_name cdn.ucc.edu.gh;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# applies to everything (not just /api/) since there's only one
		# backend target now — needed for the AI module's SSE streaming
		# (hono/streaming) to actually stream instead of arriving in one
		# buffered chunk, and doesn't hurt normal page responses.
		proxy_buffering off;
	}
}
