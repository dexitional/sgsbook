# Merged single-app deploy on the existing ehub.ucc.edu.gh server block —
# add these location blocks alongside whatever's already serving ehub at
# "/". Copy into that server block (or `include` this file from inside
# it), then `nginx -t && systemctl reload nginx`. No certbot changes
# needed — this domain's cert already covers it.
#
# Everything proxies to the one merged app process on :3000. Static assets
# now live at unprefixed paths on disk regardless of which section
# referenced them (the merged app builds with Vite `base: '/'` — see
# apps/app/vite.config.ts), so — unlike the old 3-process deploy — there's
# only one asset location pair to strip, shared by both /sgs/ and
# /sgs-admin/ pages.
#
# /sgs-api/ is now prefix-INTACT (not stripped here) — the merged app's own
# routes/sgs-api/$.ts handler does the stripping internally before calling
# into the folded-in Hono app, since Hono's routes are registered
# unprefixed and can't be retroactively rewritten. Verified end-to-end
# locally (health check, admin-auth login round-trip, a real CRUD read)
# before this file was written this way.
#
# Location patterns deliberately have NO trailing slash (`/sgs`, not
# `/sgs/`). The merged app's canonical customer route is `/sgs` without a
# trailing slash (a literal-directory index route, unlike the old
# basepath-based app whose basepath itself ended in `/`) — it 307s a
# trailing-slash request back to the no-slash form. nginx's own
# `location /sgs/ { }` prefix pattern does NOT match a bare `/sgs` request,
# so that redirect target fell through to nothing and produced a broken
# redirect loop when tested — confirmed by testing both ways locally
# before settling on this. `/sgs`, `/sgs-admin`, `/sgs-api` as prefixes
# still route correctly to their own more-specific block (nginx picks the
# longest matching prefix), so this doesn't cause cross-section collisions.

location /assets/ {
	proxy_pass http://127.0.0.1:3000/assets/;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
location = /logo.webp {
	proxy_pass http://127.0.0.1:3000/logo.webp;
	proxy_set_header Host $host;
}
location = /banner.jpg {
	proxy_pass http://127.0.0.1:3000/banner.jpg;
	proxy_set_header Host $host;
}

location /sgs-admin {
	proxy_pass http://127.0.0.1:3000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location /sgs-api {
	proxy_pass http://127.0.0.1:3000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	# the AI module streams SSE responses (hono/streaming) — don't let
	# nginx buffer them into one chunk before forwarding.
	proxy_buffering off;
}

location /sgs {
	proxy_pass http://127.0.0.1:3000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
