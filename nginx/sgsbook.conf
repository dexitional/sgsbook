# Path-prefixed deploy on the existing ehub.ucc.edu.gh server block — add
# these location blocks alongside whatever's already serving ehub at "/".
# Copy into that server block (or `include` this file from inside it), then
# `nginx -t && systemctl reload nginx`. No certbot changes needed — this
# domain's cert already covers it.
#
# IMPORTANT — why the asset locations are separate from the catch-all:
# apps/web and apps/admin are TanStack Start apps; their built server always
# serves its own static files (JS/CSS bundles, logo.webp, banner.jpg) at
# UNPREFIXED paths on disk (e.g. /assets/foo.js), regardless of the app's
# own base-path config — that config only controls what URLs the app WRITES
# into its HTML. So asset requests need the /sgs prefix STRIPPED before
# reaching the app. Page/document requests are the opposite: the app's
# router only recognizes its own basepath (baked in at build time) and
# redirects anything else BACK to it — so those must be forwarded with the
# prefix INTACT, or you get an infinite redirect loop (stripped -> app
# redirects to prefixed -> nginx strips again -> ...). Verified both ways
# locally against a real nginx before writing this.

location /sgs/assets/ {
	proxy_pass http://127.0.0.1:3000/assets/;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
location = /sgs/logo.webp {
	proxy_pass http://127.0.0.1:3000/logo.webp;
	proxy_set_header Host $host;
}
location = /sgs/banner.jpg {
	proxy_pass http://127.0.0.1:3000/banner.jpg;
	proxy_set_header Host $host;
}
location /sgs/ {
	# no path after the host here — nginx forwards the full, unmodified
	# /sgs/... URI instead of stripping the location prefix
	proxy_pass http://127.0.0.1:3000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location /sgs-admin/assets/ {
	proxy_pass http://127.0.0.1:3001/assets/;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
location = /sgs-admin/logo.webp {
	proxy_pass http://127.0.0.1:3001/logo.webp;
	proxy_set_header Host $host;
}
location /sgs-admin/ {
	proxy_pass http://127.0.0.1:3001;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

# apps/api is a plain Hono REST API with no basepath/redirect concept of its
# own, so a single stripping rule is enough here (verified working too).
location /sgs-api/ {
	proxy_pass http://127.0.0.1:4000/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
